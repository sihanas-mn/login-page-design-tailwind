<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body>
    <main class="p-8 bg-linear-60 from-purple-500 to bg-purple-300 flex justify-center items-center md:h-screen lg:h-screen">
        <div class="flex flex-col md:flex-row bg-white rounded-lg overflow-hidden max-w-7xl">
            <div class="relative bg-cover bg-center min-h-100 flex flex-col items-center justify-center p-4 gap-y-4 md:max-h-screen md:p-8 md:w-1/2 md:justify-start" style="background-image: url('./src/assets/6221846.jpg');">
                <div class="absolute inset-0 bg-black/30"></div>
                <p class="text-2xl text-white font-bold md:mt-20 z-10">Welcome</p>
                <p class="text-white z-10 text-center">Lorem ipsum dolor sit amet consectetur adipisicing elit. Beatae consequuntur ducimus alias voluptatibus veniam, minima iste. Harum fugit nam enim!</p>
            </div>

            <div class="p-6 md:w-1/2 flex flex-col gap-y-4 md:p-12 lg:p-14">
                <p class="text-3xl font-bold">Register</p>
                <p class="font-semibold">Create You Account. It's Free.</p>

                <form action="" class="flex flex-col gap-y-5 md:flex-wrap md:flex-row md:gap-x-[4%]">
                    <input placeholder="First Name" type="text" class="bg-gray-300 border-0 p-2 rounded-md w-full md:w-[48%]">
                    <input placeholder="Last Name" type="text" class="bg-gray-300 border-0 p-2 rounded-md w-full md:w-[48%]">
                    <input placeholder="Email" type="text" class="bg-gray-300 border-0 p-2 rounded-md w-full">
                    <input placeholder="Password" type="text" class="bg-gray-300 border-0 p-2 rounded-md w-full">
                    <input placeholder="Confirm Password" type="text" class="bg-gray-300 border-0 p-2 rounded-md w-full">
                    
                    <div class="flex items-center gap-4">
                        <input type="checkbox" id="t&c" class="w-5 h-5">
                        <label for="t&c"><span class="font-bold">I accept</span> the terms and condition policy.</label>
                    </div>

                    <button class="p-2 bg-purple-600 rounded-md text-white font-bold w-full">Register Now</button>
                </form>

            </div>
        </div>
    </main>
</body>
</html>
